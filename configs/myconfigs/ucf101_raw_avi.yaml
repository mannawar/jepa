app: vjepa_inference


folder: /Users/mannawarhussain/Desktop/Mannawar/iitp/outputs/ufc-output

meta:
  dtype: fp32
  seed: 234
  use_sdpa: true
  load_checkpoint: true
  read_checkpoint: /Users/mannawarhussain/Desktop/Mannawar/iitp/outputs/vid-output/latest.pt

data:
  dataset_fpcs: [4]
  batch_size: 1
  crop_size: 112
  num_frames: 8
  fps: 1
  sampling_rate: 2
  tubelet_size: 2
  patch_size: 16
  decode_one_clip: true
  num_clips: 1
  filter_short_videos: false
  num_workers: 0

data_aug:
  decode_one_clip: true
  prefetch_factor: 2
  persistent_workers: false
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [ 0.75, 1.35 ]
  random_resize_scale: [ 0.3, 1.0 ]
  reprob: 0.0

loss:
  loss_exp: 1.0
  reg_coeff: 0.0


model:
  model_name: vit_small
  pred_depth: 4
  pred_embed_dim: 192
  uniform_power: true
  use_mask_tokens: true
  num_mask_tokens: 1
  zero_init_mask_tokens: true

optimization:
  epochs: 1
  weight_decay: 0.04
  final_weight_decay: 0.4

mask:
  - aspect_ratio: [1.0, 1.0]
    num_blocks: 0
    spatial_scale: [1.0, 1.0]
    temporal_scale: [1.0, 1.0]
    max_temporal_keep: 1.0
    max_keep: null


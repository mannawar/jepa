app: vjepa_inference


folder: /Users/mannawarhussain/Desktop/Mannawar/iitp/outputs/ufc-output

meta:
  dtype: fp32
  load_checkpoint: true
  read_checkpoint: /Users/mannawarhussain/Desktop/Mannawar/iitp/outputs/vid-output/latest.pt

data:
  datasets: ['/Users/mannawarhussain/Desktop/Mannawar/iitp/Datasets/csvs/target/ucf101_raw.csv']
  dataset_type: VideoDataset
  dataset_fpcs: [1]
  batch_size: 1
  num_frames: 8
  sampling_rate: 2
  crop_size: 112
  patch_size: 16
  tubelet_size: 2
  decode_one_clip: true
  num_workers: 0
  pin_mem: true

data_aug:
  decode_one_clip: true
  prefetch_factor: 2
  persistent_workers: false
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [ 0.75, 1.35 ]
  random_resize_scale: [ 0.3, 1.0 ]
  reprob: 0.0

loss:
  loss_exp: 1.0
  reg_coeff: 0.0


model:
  model_name: vit_large
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: false

  pred_depth: 0
  pred_embed_dim: 0

optimization:
  epochs: 1
  weight_decay: 0.04
  final_weight_decay: 0.4

mask:
  - aspect_ratio: [1.0, 1.0]
    num_blocks: 0
    spatial_scale: [1.0, 1.0]
    temporal_scale: [1.0, 1.0]
    max_temporal_keep: 1.0
    max_keep: null

